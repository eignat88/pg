[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-project"
version = "0.2.0"
description = "FD document loading and semantic search utilities"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary>=2.9",
  "python-docx>=1.1",
  "requests>=2.31",
]

[project.scripts]
fd-search = "fd_project.search_service:main"
fd-load-docx = "fd_project.cli_load_docx:main"
fd-db-stats = "fd_project.cli_stats:main"

[tool.setuptools]
packages = ["fd_project"]
